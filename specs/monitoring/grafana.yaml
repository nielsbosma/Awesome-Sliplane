# yaml-language-server: $schema=https://sliplane.opendeploy.cloud/schema/v1.json
version: 1

# grafana/grafana is Grafana's OSS image; the grafana/grafana-oss repository
# stopped receiving releases at 13.0.2.
x-upstream: https://grafana.com/docs/grafana/latest/setup-grafana/configure-docker/

app:
  name: Grafana
  description: Open source dashboards and alerting for metrics, logs and traces from Prometheus, Loki, Postgres, InfluxDB and many other data sources.
  icon: https://raw.githubusercontent.com/grafana/grafana/main/public/img/grafana_icon.svg
  docs: https://grafana.com/docs/grafana/latest/setup-grafana/installation/docker/
  source: https://github.com/grafana/grafana

server:
  minimum: starter
  recommended: base

secrets:
  admin_password:
    format: alphanumeric
    length: 20
    label: Admin Password
    show: true

addons:
  email:
    use: smtp
    optional: true
    reason: Lets Grafana send alert notifications, invites and password resets.

databases:
  db:
    engine: postgres
    version: 17

services:
  grafana:
    image: docker.io/grafana/grafana:13.2.4
    public: true
    port: 3000
    healthcheck: /api/health
    volumes:
      - name: grafana-data
        mountPath: /var/lib/grafana
    env:
      GF_SERVER_HTTP_PORT: 3000
      GF_SERVER_ROOT_URL: ${{ services.grafana.url }}
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${{ secrets.admin_password }}
      GF_SECURITY_SECRET_KEY: ${{ secret(32) }}
      GF_ANALYTICS_REPORTING_ENABLED: false
      GF_DATABASE_TYPE: postgres
      GF_DATABASE_HOST: ${{ databases.db.host }}:${{ databases.db.port }}
      GF_DATABASE_NAME: ${{ databases.db.database }}
      GF_DATABASE_USER: ${{ databases.db.user }}
      GF_DATABASE_PASSWORD: ${{ databases.db.password }}
      GF_SMTP_ENABLED: ${{ if(addons.email.enabled, 'true', '') }}
      GF_SMTP_HOST: ${{ addons.email.host }}:${{ addons.email.port }}
      GF_SMTP_USER: ${{ addons.email.user }}
      GF_SMTP_PASSWORD: ${{ addons.email.password }}
      GF_SMTP_FROM_ADDRESS: ${{ addons.email.from }}
      GF_SMTP_STARTTLS_POLICY: ${{ if(addons.email.enabled, if(addons.email.security == 'none', 'NoStartTLS', 'MandatoryStartTLS'), '') }}

done:
  open: ${{ services.grafana.url }}
  message: Sign in as admin with the password below, then add your first data source.
