# yaml-language-server: $schema=https://sliplane.opendeploy.cloud/schema/v1.json
version: 1

app:
  name: Umami
  description: Simple, fast, privacy-focused web analytics without cookies. A lightweight alternative to Google Analytics, backed by Postgres.
  icon: https://raw.githubusercontent.com/nielsbosma/Awesome-Sliplane/main/logos/umami.svg
  docs: https://docs.umami.is/docs/install
  source: https://github.com/umami-software/umami
  category: Analytics

server:
  minimum: starter
  recommended: base

databases:
  db:
    engine: postgres
    version: 17

services:
  umami:
    image: ghcr.io/umami-software/umami:3.4.0
    public: true
    port: 3000
    healthcheck: /api/heartbeat
    env:
      DATABASE_URL: ${{ databases.db.url }}
      APP_SECRET: ${{ secret(48) }}
      TWO_FACTOR_ENCRYPTION_KEY: ${{ hex(64) }}

done:
  open: ${{ services.umami.url }}/login
  message: Sign in with username admin and password umami, then change the password right away under Settings, Profile. Add a website to get its tracking code.
