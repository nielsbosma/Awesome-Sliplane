# yaml-language-server: $schema=https://sliplane.opendeploy.cloud/schema/v1.json
version: 1

app:
  name: listmonk
  description: Self-hosted newsletter and mailing list manager with subscriber lists, segmentation, campaign templates, analytics and a transactional mail API.
  icon: https://raw.githubusercontent.com/knadh/listmonk/v6.2.0/static/public/static/favicon.png
  docs: https://listmonk.app/docs/installation/

server:
  minimum: starter
  recommended: base

secrets:
  admin_password:
    format: alphanumeric
    length: 20
    label: Admin Password
    show: true

databases:
  db:
    engine: postgres
    version: 17

volumes:
  listmonk-uploads:
    description: Images and files uploaded to the media library

services:
  listmonk:
    image: docker.io/listmonk/listmonk:v6.2.0
    public: true
    port: 9000
    healthcheck: /health
    # --config '' makes listmonk read its settings from the environment only.
    cmd: sh -c "./listmonk --install --idempotent --yes --config '' && ./listmonk --upgrade --yes --config '' && exec ./listmonk --config ''"
    volumes:
      - name: listmonk-uploads
        mountPath: /listmonk/uploads
    env:
      LISTMONK_app__address: 0.0.0.0:9000
      LISTMONK_db__host: ${{ databases.db.host }}
      LISTMONK_db__port: ${{ databases.db.port }}
      LISTMONK_db__user: ${{ databases.db.user }}
      LISTMONK_db__password: ${{ databases.db.password }}
      LISTMONK_db__database: ${{ databases.db.database }}
      LISTMONK_db__ssl_mode: disable
      LISTMONK_db__max_open: 25
      LISTMONK_db__max_idle: 25
      LISTMONK_db__max_lifetime: 300s
      LISTMONK_ADMIN_USER: admin
      LISTMONK_ADMIN_PASSWORD: ${{ secrets.admin_password }}
      TZ: Etc/UTC

done:
  open: ${{ services.listmonk.url }}/admin
  message: Sign in as admin with the password below. Then go to Settings, set the Root URL to ${{ services.listmonk.url }} so links in campaigns work, and add your SMTP server under Settings > SMTP before sending.
