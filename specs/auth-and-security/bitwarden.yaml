# yaml-language-server: $schema=https://sliplane.opendeploy.cloud/schema/v1.json
version: 1

app:
  name: Bitwarden
  description: Open source password manager for individuals and teams. Self-host the official Bitwarden Lite server with the web vault, and use it from the Bitwarden browser extensions, desktop and mobile apps.
  icon: https://raw.githubusercontent.com/bitwarden/brand/main/icons/icon.svg
  docs: https://bitwarden.com/help/install-and-deploy-lite/

server:
  minimum: base
  recommended: medium

inputs:
  installation_id:
    type: string
    label: Installation ID
    help: Get a free installation ID and key at https://bitwarden.com/host. Bitwarden needs them to start.
    placeholder: 00000000-0000-0000-0000-000000000000
    pattern: ^[0-9a-fA-F-]{36}$
    required: true
  installation_key:
    type: secret
    label: Installation Key
    help: The key shown next to your installation ID at https://bitwarden.com/host.
    required: true
  admin_emails:
    type: string
    label: Admin Emails
    help: Comma-separated emails allowed to sign in to the System Administrator Portal at /admin. Signing in there sends a link by email, so it needs email set up.
    placeholder: you@example.com
  disable_signups:
    type: boolean
    label: Disable Sign-Ups
    help: Turn this on after creating your own account so nobody else can register. You can still invite people to an organization.
    default: false

addons:
  email:
    use: smtp
    optional: true
    reason: Lets Bitwarden send account verification, organization invites, two-step login codes and admin portal sign-in links.

databases:
  db:
    engine: postgres
    version: 17

services:
  bitwarden:
    image: ghcr.io/bitwarden/lite:2026.10.0
    public: true
    port: 8080
    healthcheck: /alive
    volumes:
      - name: bitwarden-data
        mountPath: /etc/bitwarden
    env:
      BW_DOMAIN: ${{ services.bitwarden.host }}
      BW_DB_PROVIDER: postgresql
      BW_DB_SERVER: ${{ databases.db.host }}
      BW_DB_PORT: ${{ databases.db.port }}
      BW_DB_DATABASE: ${{ databases.db.database }}
      BW_DB_USERNAME: ${{ databases.db.user }}
      BW_DB_PASSWORD: ${{ databases.db.password }}
      BW_INSTALLATION_ID: ${{ inputs.installation_id }}
      BW_INSTALLATION_KEY: ${{ inputs.installation_key }}
      # TLS ends at Sliplane's proxy; the container serves plain HTTP on 8080.
      BW_ENABLE_SSL: false
      adminSettings__admins: ${{ inputs.admin_emails }}
      globalSettings__disableUserRegistration: ${{ if(inputs.disable_signups, 'true', 'false') }}
      globalSettings__mail__replyToEmail: ${{ addons.email.from }}
      globalSettings__mail__smtp__host: ${{ addons.email.host }}
      globalSettings__mail__smtp__port: ${{ addons.email.port }}
      globalSettings__mail__smtp__ssl: ${{ if(addons.email.enabled, if(addons.email.security == 'tls', 'true', 'false'), '') }}
      globalSettings__mail__smtp__username: ${{ addons.email.user }}
      globalSettings__mail__smtp__password: ${{ addons.email.password }}

done:
  open: ${{ services.bitwarden.url }}
  message: Open the web vault and choose Create Account to make your first account. It can take a minute or two after the first start before the vault responds.
