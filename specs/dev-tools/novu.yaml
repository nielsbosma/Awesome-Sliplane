# yaml-language-server: $schema=https://sliplane.opendeploy.cloud/schema/v1.json
version: 1

app:
  name: Novu
  description: Open source notification infrastructure for email, SMS, push, chat and in-app inbox notifications, with a workflow editor and API.
  icon: https://github.com/novuhq.png
  docs: https://docs.novu.co/community/self-hosting-novu/deploy-with-docker

server:
  minimum: medium
  recommended: large

secrets:
  mongo_password:
    format: alphanumeric
    length: 32
  jwt_secret:
    format: hex
    length: 64
  store_encryption_key:
    format: hex
    length: 32

databases:
  redis:
    engine: redis
    version: 7

buckets:
  files: {}

services:
  mongodb:
    image: docker.io/library/mongo:8.0.17
    port: 27017
    protocol: tcp
    volumes:
      - name: novu-mongodb
        mountPath: /data/db
    env:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${{ secrets.mongo_password }}

  api:
    image: ghcr.io/novuhq/novu/api:3.19.0
    public: true
    port: 3000
    healthcheck: /v1/health-check
    dependsOn:
      - mongodb
    env:
      NODE_ENV: production
      API_ROOT_URL: ${{ services.api.url }}
      # A regex of allowed dashboard origins (CORS). It cannot reference services.dashboard.url,
      # because the dashboard already references the API and the spec forbids reference loops.
      FRONT_BASE_URL: '^https://[a-z0-9-]+\.sliplane\.app$'
      MONGO_URL: mongodb://root:${{ secrets.mongo_password }}@${{ services.mongodb.internalHost }}:27017/novu-db?authSource=admin
      MONGO_MIN_POOL_SIZE: 5
      MONGO_MAX_POOL_SIZE: 10
      MONGO_AUTO_CREATE_INDEXES: "true"
      REDIS_HOST: ${{ databases.redis.host }}
      REDIS_PORT: ${{ databases.redis.port }}
      REDIS_DB_INDEX: 2
      REDIS_CACHE_SERVICE_HOST: ${{ databases.redis.host }}
      REDIS_CACHE_SERVICE_PORT: ${{ databases.redis.port }}
      S3_LOCAL_STACK: ${{ buckets.files.endpoint }}
      S3_BUCKET_NAME: ${{ buckets.files.bucket }}
      S3_REGION: ${{ buckets.files.region }}
      AWS_ACCESS_KEY_ID: ${{ buckets.files.accessKeyId }}
      AWS_SECRET_ACCESS_KEY: ${{ buckets.files.secretAccessKey }}
      JWT_SECRET: ${{ secrets.jwt_secret }}
      STORE_ENCRYPTION_KEY: ${{ secrets.store_encryption_key }}
      NOVU_SECRET_KEY: ${{ hex(64) }}
      SUBSCRIBER_WIDGET_JWT_EXPIRATION_TIME: 15d
      IS_API_IDEMPOTENCY_ENABLED: "false"
      IS_API_RATE_LIMITING_ENABLED: "false"
      IS_NEW_MESSAGES_API_RESPONSE_ENABLED: "true"
      IS_V2_ENABLED: "true"
      IS_SELF_HOSTED: "true"
      NEW_RELIC_ENABLED: "false"

  worker:
    image: ghcr.io/novuhq/novu/worker:3.19.0
    port: 3004
    healthcheck: /v1/health-check
    dependsOn:
      - mongodb
    env:
      NODE_ENV: production
      API_ROOT_URL: ${{ services.api.internalUrl }}
      MONGO_URL: mongodb://root:${{ secrets.mongo_password }}@${{ services.mongodb.internalHost }}:27017/novu-db?authSource=admin
      MONGO_MIN_POOL_SIZE: 5
      MONGO_MAX_POOL_SIZE: 10
      REDIS_HOST: ${{ databases.redis.host }}
      REDIS_PORT: ${{ databases.redis.port }}
      REDIS_DB_INDEX: 2
      REDIS_CACHE_SERVICE_HOST: ${{ databases.redis.host }}
      REDIS_CACHE_SERVICE_PORT: ${{ databases.redis.port }}
      S3_LOCAL_STACK: ${{ buckets.files.endpoint }}
      S3_BUCKET_NAME: ${{ buckets.files.bucket }}
      S3_REGION: ${{ buckets.files.region }}
      AWS_ACCESS_KEY_ID: ${{ buckets.files.accessKeyId }}
      AWS_SECRET_ACCESS_KEY: ${{ buckets.files.secretAccessKey }}
      STORE_ENCRYPTION_KEY: ${{ secrets.store_encryption_key }}
      SUBSCRIBER_WIDGET_JWT_EXPIRATION_TIME: 15d
      BROADCAST_QUEUE_CHUNK_SIZE: 100
      MULTICAST_QUEUE_CHUNK_SIZE: 100
      IS_EMAIL_INLINE_CSS_DISABLED: "false"
      IS_USE_MERGED_DIGEST_ID_ENABLED: "false"
      NEW_RELIC_ENABLED: "false"

  ws:
    image: ghcr.io/novuhq/novu/ws:3.19.0
    public: true
    port: 3002
    healthcheck: /v1/health-check
    dependsOn:
      - mongodb
    env:
      NODE_ENV: production
      MONGO_URL: mongodb://root:${{ secrets.mongo_password }}@${{ services.mongodb.internalHost }}:27017/novu-db?authSource=admin
      MONGO_MIN_POOL_SIZE: 5
      MONGO_MAX_POOL_SIZE: 10
      REDIS_HOST: ${{ databases.redis.host }}
      REDIS_PORT: ${{ databases.redis.port }}
      JWT_SECRET: ${{ secrets.jwt_secret }}
      NEW_RELIC_ENABLED: "false"

  dashboard:
    image: ghcr.io/novuhq/novu/dashboard:3.19.0
    public: true
    port: 4000
    healthcheck: /
    env:
      VITE_API_HOSTNAME: ${{ services.api.url }}
      VITE_WEBSOCKET_HOSTNAME: ${{ services.ws.url }}

done:
  open: ${{ services.dashboard.url }}
  message: Open the Novu dashboard and sign up; the first account creates your organization. Point SDKs and the Inbox component at the API service URL.
