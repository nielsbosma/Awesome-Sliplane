# yaml-language-server: $schema=https://sliplane.opendeploy.cloud/schema/v1.json
version: 1

app:
  name: PeerTube
  description: Decentralized video platform. Host your own video site with channels, playlists and transcoding, and federate with other PeerTube instances through ActivityPub.
  icon: https://raw.githubusercontent.com/Chocobozzz/PeerTube/develop/client/src/assets/images/icons/icon-192x192.png
  docs: https://docs.joinpeertube.org/install/docker
  source: https://github.com/Chocobozzz/PeerTube

server:
  minimum: medium
  recommended: large
  diskGb: 100

inputs:
  admin_email:
    type: email
    label: Admin Email
    help: The root account's email address, shown as the instance contact.
    required: true

secrets:
  root_password:
    format: alphanumeric
    length: 20
    label: Root Password
    show: true

addons:
  domain:
    use: domain
    service: peertube
    optional: true
    label: PeerTube Domain
    reason: Other instances federate with this hostname, and it can't be changed after the first start, so add your own domain now if you plan to use one.
  email:
    use: smtp
    optional: true
    reason: Sends account verification, password reset and notification emails.

databases:
  db:
    engine: postgres
    version: 17
  redis:
    engine: redis

services:
  peertube:
    image: docker.io/chocobozzz/peertube:v8.3.1
    public: true
    port: 9000
    healthcheck: /api/v1/ping
    volumes:
      - name: peertube-data
        mountPath: /data
      - name: peertube-config
        mountPath: /config
    env:
      PEERTUBE_WEBSERVER_HOSTNAME: ${{ addons.domain.hostname ?? services.peertube.host }}
      PEERTUBE_WEBSERVER_PORT: 443
      PEERTUBE_WEBSERVER_HTTPS: true
      PEERTUBE_SECRET: ${{ hex(64) }}
      PEERTUBE_DB_HOSTNAME: ${{ databases.db.host }}
      PEERTUBE_DB_PORT: ${{ databases.db.port }}
      PEERTUBE_DB_NAME: ${{ databases.db.database }}
      PEERTUBE_DB_USERNAME: ${{ databases.db.user }}
      PEERTUBE_DB_PASSWORD: ${{ databases.db.password }}
      PEERTUBE_REDIS_HOSTNAME: ${{ databases.redis.host }}
      PEERTUBE_REDIS_PORT: ${{ databases.redis.port }}
      PEERTUBE_ADMIN_EMAIL: ${{ inputs.admin_email }}
      PT_INITIAL_ROOT_PASSWORD: ${{ secrets.root_password }}
      PEERTUBE_SMTP_HOSTNAME: ${{ addons.email.host }}
      PEERTUBE_SMTP_PORT: ${{ addons.email.port }}
      PEERTUBE_SMTP_USERNAME: ${{ addons.email.user }}
      PEERTUBE_SMTP_PASSWORD: ${{ addons.email.password }}
      PEERTUBE_SMTP_FROM: ${{ addons.email.from }}
      PEERTUBE_SMTP_TLS: ${{ if(addons.email.enabled, if(addons.email.security == 'tls', 'true', 'false'), '') }}
      PEERTUBE_SMTP_DISABLE_STARTTLS: ${{ if(addons.email.enabled, if(addons.email.security == 'none', 'true', 'false'), '') }}

done:
  open: https://${{ addons.domain.hostname ?? services.peertube.host }}/login
  message: Sign in as root with the root password below and finish the setup wizard. Live streaming is not available because Sliplane can't expose PeerTube's RTMP port.
